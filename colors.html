<!DOCTYPE html>
<html lang="em"></html>
    <head>
        <title>Color Theory</title>
        <meta charset="UTF">
        <style>
            div{
                height: 150px;
                width: 150px;
                border: solid 5px black;
            }
            #complementary{
                border-color: red;
                background-color: green;
            }
            #analogous{
                border-color: blue;
                background-color: darkblue;
                color: lightblue;
            }
            #triadie{
                border-color: maroon;
                background-color: blue;
                color: orange;
            }
        </style>
    </head>
    <body>
        <div id="complementary">
            <p>Complementary</p>
        </div>
        <div id="analogous">
            <p>Analogous</p>
        </div>
        <div id="triadie">
            <p>Triadie</p>
        </div>
    </body>
